# Generated by strand. Do not edit; re-run `strand sync` to refresh.
# Project: dbapp
name: dbapp
services:
  db:
    image: postgres:16
    container_name: ${COMPOSE_PROJECT_NAME}-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - ${PG_PORT}:5432
    volumes:
      - ${STRAND_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app
      interval: 5s
      timeout: 3s
      retries: 10
